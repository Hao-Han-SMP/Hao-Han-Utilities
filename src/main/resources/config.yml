pickup:
  maximum-distance: 4.5

# Hiện thông báo thao tác trong chat và ghi chi tiết chẩn đoán vào console.
# Mặc định tắt; bật rồi dùng /hhu reload khi cần.
debug: false

placement:
  maximum-distance: 5.0

carrying:
  # Người chơi chưa tự chọn sẽ bật carry mode mặc định.
  enabled-by-default: true
  # Phím giữ mặc định khi nhấc vật: sprint hoặc sneak.
  default-activation-key: sprint
  # Tốc độ khi mang vật thường hoặc container rỗng.
  movement-speed-multiplier: 0.75
  # Container càng đầy thì tốc độ càng tiến gần mức này.
  full-container-movement-speed-multiplier: 0.35
  disable-gliding: true
  disable-flight: false
  # Bật nếu muốn ngăn người đang carry chủ động gây sát thương.
  # Người đang carry vẫn luôn nhận sát thương bình thường.
  disable-combat: false

recovery:
  restore-on-startup: true

protection:
  enabled: true

entities:
  enabled: true

players:
  enabled: true

animation:
  object-scale: 1.05
  forward-offset: 0.72
  vertical-offset: -0.55
  entity-forward-offset: 0.95
  entity-vertical-offset: -1.15

phantom-suppression:
  enabled: true
  remove-existing: true

crop-replant:
  enabled: true
  break: true
  right-click: true

concrete-mixer:
  enabled: true
  require-permission: false
  lower-water-level: true
  effects:
    enabled: true
    splash:
      particles:
        enabled: true
      sound:
        enabled: true
        name: ENTITY_GENERIC_SPLASH
        volume: 0.75
        pitch: 1.0
    transform:
      particles:
        enabled: true
      sound:
        enabled: true
        name: BLOCK_FIRE_EXTINGUISH
        volume: 0.65
        pitch: 1.25

worlds:
  mode: BLACKLIST
  list:
    - world_the_end

blocks:
  allowed:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - FURNACE
    - BLAST_FURNACE
    - SMOKER
    - HOPPER
    - DISPENSER
    - DROPPER
    - BREWING_STAND
    - CRAFTER
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
    - CHISELED_BOOKSHELF
    - DECORATED_POT
    - JUKEBOX
    - BEEHIVE
    - BEE_NEST
    - CRAFTING_TABLE
    - SMITHING_TABLE
    - STONECUTTER
    - CARTOGRAPHY_TABLE
    - LOOM
    - GRINDSTONE
    - ENCHANTING_TABLE

ender-chest:
  enabled: true
  size: 54

torch-fire:
  enabled: true
  duration-seconds:
    torch: 3
    soul-torch: 4
    redstone-torch: 1
  consume-torch: false

crystal-heart:
  enabled: true
  max-health-cap: 60.0
  min-health-cap: 20.0
  hp-per-heart: 2.0
  death-hp-loss: 2.0
  regeneration-duration-seconds: 10
  recipe:
    enabled: true

dog-fetch:
  # Bật tính năng ném gậy (stick) cho chó thuần hóa nhặt
  enabled: true
  # Bán kính tìm chó thuần hóa gần bạn nhất (block)
  search-radius: 32.0
  # Lực ném gậy tối thiểu và tối đa khi gồng
  min-throw-velocity: 0.55
  max-throw-velocity: 1.85
  # Thời gian gồng tối đa (ticks, 20 ticks = 1 giây)
  max-charge-ticks: 24
  # Tốc độ chó chạy ra nhặt gậy
  run-speed-multiplier: 1.55
  # Tốc độ chó chạy về trả gậy cho chủ
  return-speed-multiplier: 1.40
  # Hiển thị gậy ngậm trong miệng chó khi nhặt về
  show-stick-in-mouth: true
  # Yêu cầu permission haohanutilities.dogfetch.use
  require-permission: false
  # Chó phấn khích chạy lại gần và chạy vòng quanh khi bạn cầm gậy (chỉ áp dụng với chó đang đứng)
  excited-wait:
    enabled: true
    speed-multiplier: 1.45
    circle-radius: 2.6
