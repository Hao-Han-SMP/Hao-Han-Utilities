name: HaoHanUtilities
version: '${version}'
main: vn.haohan.utilities.HaoHanUtilitiesPlugin
api-version: '1.21.11'
author: Hao Han SMP
description: Carry and utility features with crash recovery.

softdepend:
  - SoulAnchor
  - WorldGuard
  - GriefPrevention
  - BlockLocker
  - BetterTeams
  - GSit

commands:
  haohanutilities:
    description: Lệnh quản trị Hảo Hán Utilities
    usage: /haohanutilities <info|toggle|bind|reload|status|inspect|recover>
    aliases: [hhu, carryblocks, carryblock, cb]
  concretemixer:
    description: Hiển thị thông tin Concrete Mixer hoặc reload cấu hình
    usage: /concretemixer <version|reload>

permissions:
  haohanutilities.carry.use:
    description: Cho phép carry block, động vật và người chơi
    default: true
  haohanutilities.admin:
    description: Quản trị Hảo Hán Utilities
    default: op
  haohanutilities.crops.use:
    description: Cho phép tự động thu hoạch và trồng lại crop
    default: true
  haohanutilities.concrete-mixer:
    description: Cho phép đổi concrete powder thành concrete bằng cauldron nước
    default: true
  concretemixer.cauldrons:
    description: Cho phép dùng cauldron để tạo concrete
    default: true
  concretemixer.admin:
    description: Cho phép reload cấu hình Concrete Mixer
    default: op
  haohanutilities.bypass.protection:
    description: Bỏ qua kiểm tra protection khi carry block
    default: op
