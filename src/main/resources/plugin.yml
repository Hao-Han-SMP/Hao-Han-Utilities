name: HaoHanUtilities
version: '${version}'
main: vn.haohan.utilities.HaoHanUtilitiesPlugin
api-version: '1.21.11'
author: Hao Han SMP
description: Carry and utility features with crash recovery.

softdepend:
  - SoulAnchor
  - WorldGuard
  - GriefPrevention
  - BlockLocker
  - BetterTeams
  - GSit
  - ModelEngine
  - HaoHanItemCore

commands:
  haohanutilities:
    description: Lệnh quản trị Hảo Hán Utilities
    usage: /haohanutilities <info|toggle|bind|reload|status|inspect|recover>
    aliases: [hhu, carryblocks, carryblock, cb]
  concretemixer:
    description: Hiển thị thông tin Concrete Mixer hoặc reload cấu hình
    usage: /concretemixer <version|reload>
  reachtoggle:
    description: Bật hoặc tắt tính năng mở xuyên qua khung tranh/biển/tranh vẽ gắn trên rương
    usage: /reachtoggle [on|off]
    aliases: [reachthrough, rtoggle]

permissions:
  haohanutilities.carry.use:
    description: Cho phép carry block, động vật và người chơi
    default: true
  haohanutilities.dogfetch.use:
    description: Cho phép ném gậy để chó thuần hóa chạy đi nhặt và trả về
    default: true
  haohanutilities.admin:
    description: Quản trị Hảo Hán Utilities
    default: op
  haohanutilities.crops.use:
    description: Cho phép tự động thu hoạch và trồng lại crop
    default: true
  haohanutilities.concrete-mixer:
    description: Cho phép đổi concrete powder thành concrete bằng cauldron nước
    default: true
  concretemixer.cauldrons:
    description: Cho phép dùng cauldron để tạo concrete
    default: true
  concretemixer.admin:
    description: Cho phép reload cấu hình Concrete Mixer
    default: op
  haohanutilities.bypass.protection:
    description: Bỏ qua kiểm tra protection khi carry block
    default: op
  haohanutilities.dummy.use:
    description: Cho phép đặt và tương tác với bù nhìn rơm (Dummy)
    default: true
  haohanutilities.dummy.craft:
    description: Cho phép chế tạo bù nhìn rơm
    default: true
  haohanutilities.invisible-frame.use:
    description: Cho phép sử dụng amethyst lên item frame để làm tàng hình
    default: true
  haohanutilities.reachthrough.use:
    description: Cho phép mở xuyên qua khung tranh, tranh vẽ, biển gắn trên rương
    default: true
  haohanutilities.reachthrough.toggle:
    description: Cho phép người chơi tự bật/tắt tính năng reach-through
    default: true
  haohanutilities.blockoverlay.use:
    description: Cho phép đặt tuyết và thảm vào trong các block không full
    default: true
